{% extends 'Shop/Head.html' %}
{% block content %}

<style>

/* Background section */
.cp-container{
    display:flex;
    justify-content:center;
    align-items:center;
    animation: fadeIn 0.6s ease-in-out;
}

/* Card */
.cp-card{
    width:420px;
    background:#ffffff;
    padding:35px;
    border-radius:12px;
    box-shadow:0px 10px 25px rgba(0,0,0,0.1);
    transition:0.3s;
}

.cp-card:hover{
    transform:translateY(-4px);
}

/* Title */
.cp-title{
    text-align:center;
    font-weight:700;
    margin-bottom:25px;
}

/* Input container */
.cp-input-box{
    position:relative;
    margin-bottom:18px;
}

/* Icon inside input */
.cp-input-icon{
    position:absolute;
    top:12px;
    left:12px;
    color:#999;
}

/* Input field */
.cp-input{
    width:100%;
    padding:10px 12px 10px 38px;
    border-radius:8px;
    border:1px solid #ddd;
    transition:0.3s;
}

.cp-input:focus{
    border-color:#ff7b7b;
    box-shadow:0px 0px 5px rgba(255,123,123,0.4);
    outline:none;
}

/* Buttons */
.cp-btn-area{
    text-align:center;
    margin-top:20px;
}

.cp-btn{
    padding:10px 22px;
    border:none;
    border-radius:8px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

/* Change button */
.cp-btn-change{
    background:#ff7b7b;
    color:white;
}

.cp-btn-change:hover{
    background:#ff5252;
}

/* Cancel button */
.cp-btn-cancel{
    background:#eee;
    margin-left:10px;
}

.cp-btn-cancel:hover{
    background:#ddd;
}

/* Animation */
@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>


<div class="cp-container">

<form action="" method="post">
{% csrf_token %}

<div class="cp-card">

<h3 class="cp-title">
<i class="fa-solid fa-lock"></i> Change Password
</h3>

<!-- Old Password -->
<div class="cp-input-box">
<i class="fa-solid fa-lock cp-input-icon"></i>

<input type="password"
class="cp-input"
name="txt_password"
placeholder="Old Password"
pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters"
required>
</div>


<!-- New Password -->
<div class="cp-input-box">
<i class="fa-solid fa-key cp-input-icon"></i>

<input type="password"
class="cp-input"
name="txt_newpassword"
placeholder="New Password"
pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
required>
</div>


<!-- Retype Password -->
<div class="cp-input-box">
<i class="fa-solid fa-key cp-input-icon"></i>

<input type="password"
class="cp-input"
name="txt_repassword"
placeholder="Retype Password"
pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
required>
</div>


<!-- Buttons -->
<div class="cp-btn-area">

<button type="submit" class="cp-btn cp-btn-change">
<i class="fa-solid fa-check"></i> Change
</button>

<button type="reset" class="cp-btn cp-btn-cancel">
<i class="fa-solid fa-xmark"></i> Cancel
</button>

</div>

</div>

</form>

</div>


{% if msg %}
<script>
alert("{{msg}}")
window.location="{% url 'Shop:MyProfile' %}"
</script>
{% endif %}

{% endblock %}
