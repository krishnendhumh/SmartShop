<!DOCTYPE html>
<html>
<head>
    <title>Refund List</title>
</head>
<body>

<h2>Refunded Orders</h2>

<table border="1" cellpadding="8">
    <tr>
        <th>Order ID</th>
        <th>Product</th>
        <th>User</th>
        <th>Qty</th>
        <th>Amount</th>
        <th>Status</th>
    </tr>

    {% for r in refunded %}
    <tr>
        <td>{{ r.booking.id }}</td>
        <td>{{ r.product.product_name }}</td>
        <td>{{ r.booking.user.user_name }}</td>
        <td>{{ r.cart_qty }}</td>
        <td>₹{{ r.cart_qty|mul:r.product.product_price }}</td>
        <td>Refunded</td>
    </tr>
    {% empty %}
    <tr><td colspan="6">No refunds processed</td></tr>
    {% endfor %}
</table>

</body>
</html>
