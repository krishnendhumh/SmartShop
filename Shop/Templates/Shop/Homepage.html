<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            width: 380px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 25px;
            color: #333;
        }

        .menu a {
            display: block;
            margin: 12px 0;
            padding: 12px;
            text-decoration: none;
            font-size: 16px;
            color: #ffffff;
            background: #667eea;
            border-radius: 8px;
            transition: 0.3s;
        }

        .menu a:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }
        .logout {
    background: linear-gradient(135deg, #000000, #434343);
}

    </style>
</head>

<body>
    <div class="container">
        <h2>Welcome</h2>

        <div class="menu">
            <a href="{% url 'Shop:MyProfile' %}">My Profile</a>
            <a href="{% url 'Shop:Product' %}">Add Product</a>
            <a href="{% url 'Shop:ViewBooking' %}">View Bookings</a>
            <a href="{% url 'Shop:SalesReport' %}">Sales Report</a>
            <a href="{% url 'Shop:ViewRequests' %}">View Request</a>
             <a href="{% url 'Admin:logout' %}" class="logout">
    <i class="fa-solid fa-right-from-bracket"></i> Logout
        </div>
    </div>
</body>
</html>
