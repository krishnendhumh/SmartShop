{% extends 'Guest/Head.html' %}
{% load static %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
    :root {
        --login-primary: #3b82f6;
        --login-glow: rgba(59, 130, 246, 0.5);
        --login-bg-dark: #0f172a;
    }

    .login-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--login-bg-dark);
        /* Animated gradient background */
        background: radial-gradient(circle at top left, #1e293b, #0f172a);
        font-family: 'Plus Jakarta Sans', sans-serif;
        padding: 20px;
    }

    .login-card {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 32px;
        padding: 3rem;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        position: relative;
        animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardAppear {
        from { opacity: 0; transform: translateY(30px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Decorative Glow */
    .login-card::after {
        content: '';
        position: absolute;
        top: -2px; left: -2px; right: -2px; bottom: -2px;
        background: linear-gradient(45deg, var(--login-primary), transparent, #8b5cf6);
        z-index: -1;
        border-radius: 34px;
        opacity: 0.3;
    }

    .login-header {
        text-align: center;
        margin-bottom: 2.5rem;
    }

    .login-brand-icon {
        width: 64px;
        height: 64px;
        background: linear-gradient(135deg, var(--login-primary), #60a5fa);
        border-radius: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 1.8rem;
        color: white;
        margin-bottom: 1.5rem;
        box-shadow: 0 10px 20px var(--login-glow);
    }

    .login-header h2 {
        color: white;
        font-weight: 700;
        letter-spacing: -0.5px;
        margin-bottom: 8px;
    }

    .login-header p {
        color: #94a3b8;
        font-size: 0.9rem;
    }

    /* Form Styles */
    .form-group {
        margin-bottom: 1.5rem;
    }

    .login-label {
        display: block;
        color: #e2e8f0;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 8px;
        margin-left: 4px;
    }

    .input-container {
        position: relative;
    }

    .input-container i {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: #64748b;
        transition: 0.3s;
    }

    .login-input {
        width: 100%;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 14px 16px 14px 48px;
        color: white;
        font-size: 0.95rem;
        transition: all 0.3s;
    }

    .login-input:focus {
        outline: none;
        border-color: var(--login-primary);
        background: rgba(15, 23, 42, 0.8);
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
    }

    .login-input:focus + i {
        color: var(--login-primary);
    }

    /* Password Toggle */
    .pass-toggle {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: #64748b;
        cursor: pointer;
        font-size: 0.9rem;
    }

    .pass-toggle:hover { color: white; }

    /* Action Links */
    .login-meta {
        display: flex;
        justify-content: flex-end;
        margin-top: -10px;
        margin-bottom: 2rem;
    }

    .forgot-link {
        color: var(--login-primary);
        font-size: 0.82rem;
        text-decoration: none;
        font-weight: 600;
    }

    .forgot-link:hover { text-decoration: underline; }

    /* Submit Button */
    .login-submit {
        width: 100%;
        padding: 16px;
        background: var(--login-primary);
        color: white;
        border: none;
        border-radius: 16px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .login-submit:hover {
        background: #2563eb;
        transform: translateY(-2px);
        box-shadow: 0 10px 20px -5px var(--login-glow);
    }

    .login-submit:active { transform: translateY(0); }

</style>

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <div class="login-brand-icon">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2>Secure Login</h2>
            <p>Access your professional dashboard</p>
        </div>

        <form action="" method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="login-label">Email Address</label>
                <div class="input-container">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" name="txt_email" class="login-input" placeholder="name@company.com" required>
                </div>
            </div>

            <div class="form-group">
                <label class="login-label">Password</label>
                <div class="input-container">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="txt_password" id="loginPass" class="login-input" placeholder="••••••••" required>
                    <i class="fa-solid fa-eye-slash pass-toggle" id="toggleIcon" onclick="togglePassword()"></i>
                </div>
            </div>

            <div class="login-meta">
                <a href="{% url 'Guest:forgotpassword' %}" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" class="login-submit">
                Sign In <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>
    </div>
</div>

{% if msg %}
<script>
    alert("{{msg}}");
    window.location = "{% url 'Guest:Login' %}";
</script>
{% endif %}

<script>
    // Show/Hide Password functionality
    function togglePassword() {
        const passInput = document.getElementById('loginPass');
        const toggleIcon = document.getElementById('toggleIcon');
        
        if (passInput.type === 'password') {
            passInput.type = 'text';
            toggleIcon.classList.remove('fa-eye-slash');
            toggleIcon.classList.add('fa-eye');
        } else {
            passInput.type = 'password';
            toggleIcon.classList.remove('fa-eye');
            toggleIcon.classList.add('fa-eye-slash');
        }
    }
</script>

{% endblock %}
