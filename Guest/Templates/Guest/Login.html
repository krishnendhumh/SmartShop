<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(-45deg, #667eea, #764ba2, #43cea2, #185a9d);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-box {
            background: rgba(255,255,255,0.96);
            padding: 40px;
            width: 350px;
            border-radius: 18px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.35);
            animation: slideFade 0.8s ease;
        }

        @keyframes slideFade {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 22px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 40px 12px 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
        }

        .input-group label {
            position: absolute;
            top: 50%;
            left: 12px;
            transform: translateY(-50%);
            color: #888;
            font-size: 13px;
            pointer-events: none;
            transition: 0.3s;
            background: #fff;
            padding: 0 6px;
        }

        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: -8px;
            font-size: 12px;
            color: #667eea;
        }

        .input-group i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.3);
        }
    </style>
</head>

<body>

<div class="login-box">
    <h2>Welcome Back 👋</h2>
    <div class="subtitle">Login to continue</div>

    <form action="" method="post">
        {% csrf_token %}

        <div class="input-group">
            <input type="email" name="txt_email" id="txt_email" placeholder=" " required>
            <label>Email Address</label>
            <i class="fa-solid fa-envelope"></i>
        </div>

        <div class="input-group">
            <input type="password" name="txt_password" id="txt_password" placeholder=" " required>
            <label>Password</label>
            <i class="fa-solid fa-eye" onclick="togglePassword()"></i>
        </div>

        <input type="submit" value="Login" class="btn">
    </form>
</div>

<script>
    function togglePassword() {
        let pwd = document.getElementById("txt_password");
        pwd.type = pwd.type === "password" ? "text" : "password";
    }
</script>

</body>
</html>

{% if msg %}
<script>
    alert("{{msg}}");
    window.location = "{% url 'Guest:Login' %}";
</script>
{% endif %}
