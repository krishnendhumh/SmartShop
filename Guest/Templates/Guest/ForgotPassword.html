{% extends 'Guest/Head.html' %}
{% load static %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
    :root {
        --auth-primary: #3b82f6;
        --auth-bg-dark: #0f172a;
        --auth-glow: rgba(59, 130, 246, 0.4);
    }

    .auth-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at top right, #1e293b, #0f172a);
        font-family: 'Plus Jakarta Sans', sans-serif;
        padding: 20px;
    }

    .auth-card {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 32px;
        padding: 3.5rem;
        width: 100%;
        max-width: 460px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        position: relative;
        animation: cardSlideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardSlideUp {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Floating Header Icon */
    .auth-header-icon {
        width: 68px;
        height: 68px;
        background: rgba(59, 130, 246, 0.1);
        border: 1px solid rgba(59, 130, 246, 0.3);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.8rem;
        color: var(--auth-primary);
        margin: 0 auto 1.5rem;
        box-shadow: 0 0 20px rgba(59, 130, 246, 0.1);
    }

    .auth-header h2 {
        color: white;
        font-weight: 700;
        text-align: center;
        margin-bottom: 8px;
    }

    .auth-header p {
        color: #94a3b8;
        text-align: center;
        font-size: 0.9rem;
        margin-bottom: 2.5rem;
    }

    /* Alerts */
    .auth-alert {
        background: rgba(59, 130, 246, 0.1);
        border: 1px solid rgba(59, 130, 246, 0.2);
        color: #93c5fd;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 0.85rem;
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    /* Form Elements */
    .form-group {
        margin-bottom: 1.5rem;
    }

    .auth-label {
        color: #cbd5e1;
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
        display: block;
    }

    .input-container {
        position: relative;
    }

    .input-container i {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: #64748b;
        transition: 0.3s;
    }

    .auth-input {
        width: 100%;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 14px 16px 14px 48px;
        color: white;
        transition: all 0.3s;
        outline: none;
    }

    .auth-input:focus {
        border-color: var(--auth-primary);
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        background: rgba(15, 23, 42, 0.8);
    }

    .auth-input:focus + i {
        color: var(--auth-primary);
    }

    /* Submit Button */
    .auth-submit-btn {
        width: 100%;
        padding: 16px;
        background: var(--auth-primary);
        color: white;
        border: none;
        border-radius: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-top: 2rem;
    }

    .auth-submit-btn:hover {
        background: #2563eb;
        transform: translateY(-2px);
        box-shadow: 0 10px 20px -5px var(--auth-glow);
    }

    /* Navigation Link */
    .auth-footer-link {
        display: block;
        text-align: center;
        margin-top: 2rem;
        color: #94a3b8;
        text-decoration: none;
        font-size: 0.9rem;
        transition: 0.3s;
        font-weight: 500;
    }

    .auth-footer-link:hover {
        color: var(--auth-primary);
    }

</style>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-header-icon">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2>Reset Password</h2>
            <p>No worries, we'll send you reset instructions via email.</p>
        </div>

        {% if msg %}
        <div class="auth-alert">
            <i class="fa-solid fa-circle-info"></i>
            <span>{{ msg }}</span>
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="auth-label">Account Email</label>
                <div class="input-container">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" name="txt_email" class="auth-input" placeholder="Enter your registered email" required>
                </div>
            </div>

            <button type="submit" class="auth-submit-btn">
                Send Reset Code <i class="fa-solid fa-paper-plane"></i>
            </button>

            <a href="{% url 'Guest:Login' %}" class="auth-footer-link">
                <i class="fa-solid fa-arrow-left me-2"></i> Back to login
            </a>
        </form>
    </div>
</div>
{% endblock %}
