{% extends 'Guest/Head.html' %}
{% load static %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
    :root {
        --otp-primary: #3b82f6;
        --otp-bg-dark: #0f172a;
        --otp-accent: #60a5fa;
    }

    .otp-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at bottom left, #1e293b, #0f172a);
        font-family: 'Plus Jakarta Sans', sans-serif;
        padding: 20px;
    }

    .otp-card {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 32px;
        padding: 3.5rem;
        width: 100%;
        max-width: 460px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        animation: otpPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes otpPop {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
    }

    .otp-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .otp-header-icon {
        width: 68px;
        height: 68px;
        background: rgba(96, 165, 250, 0.1);
        color: var(--otp-accent);
        border-radius: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 1.8rem;
        margin-bottom: 1.5rem;
        border: 1px solid rgba(96, 165, 250, 0.2);
    }

    .otp-header h2 { color: white; font-weight: 700; margin-bottom: 8px; }
    .otp-header p { color: #94a3b8; font-size: 0.9rem; line-height: 1.5; }

    /* Alert Styling */
    .otp-alert {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.2);
        color: #fca5a5;
        padding: 12px;
        border-radius: 12px;
        font-size: 0.85rem;
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    /* OTP Input Field */
    .otp-input-group {
        text-align: center;
        margin-bottom: 2rem;
    }

    .otp-field {
        width: 100%;
        background: rgba(15, 23, 42, 0.6) !important;
        border: 2px solid rgba(255, 255, 255, 0.1) !important;
        border-radius: 16px !important;
        padding: 16px !important;
        color: white !important;
        font-size: 2rem !important;
        font-weight: 700 !important;
        letter-spacing: 12px !important;
        text-align: center !important;
        transition: all 0.3s;
        outline: none;
    }

    .otp-field:focus {
        border-color: var(--otp-primary) !important;
        background: rgba(15, 23, 42, 0.8) !important;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
    }

    /* Submit Button */
    .otp-submit-btn {
        width: 100%;
        padding: 16px;
        background: var(--otp-primary);
        color: white;
        border: none;
        border-radius: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .otp-submit-btn:hover {
        background: #2563eb;
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
    }

    /* Footer Links */
    .otp-footer {
        display: flex;
        justify-content: space-between;
        margin-top: 2rem;
    }

    .otp-link {
        color: #94a3b8;
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 500;
        transition: 0.3s;
    }

    .otp-link:hover { color: var(--otp-accent); }

    .otp-link i { font-size: 0.75rem; }

</style>

<div class="otp-wrapper">
    <div class="otp-card">
        <div class="otp-header">
            <div class="otp-header-icon">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2>Verify Account</h2>
            <p>We've sent a secure code to<br><strong style="color: white;">{{ email }}</strong></p>
        </div>

        {% if msg %}
        <div class="otp-alert">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>{{ msg }}</span>
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            
            <div class="otp-input-group">
                <label style="color: #cbd5e1; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; display: block; margin-bottom: 12px;">Enter 6-Digit Code</label>
                <input type="text" 
                       name="txt_otp" 
                       class="otp-field" 
                       placeholder="000000" 
                       maxlength="6" 
                       pattern="\d{6}" 
                       required 
                       autofocus 
                       autocomplete="one-time-code">
            </div>

            <button type="submit" class="otp-submit-btn">
                Verify Identity <i class="fa-solid fa-circle-check"></i>
            </button>

            <div class="otp-footer">
                <a href="{% url 'Guest:forgotpassword' %}" class="otp-link">
                    <i class="fa-solid fa-rotate-right me-1"></i> Resend Code
                </a>
                <a href="{% url 'Guest:Login' %}" class="otp-link">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to Login
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    // Simple script to ensure only numbers are typed
    document.querySelector('.otp-field').addEventListener('input', function (e) {
        this.value = this.value.replace(/[^0-9]/g, '');
    });
</script>

{% endblock %}
