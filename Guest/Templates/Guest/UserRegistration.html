{% extends 'Guest/Head.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>

    <style>
        
        form {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            width: 420px;
        }

        table {
            width: 100%;
            border: none;
        }

        td {
            border: none;
            padding: 8px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        textarea,
        select {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
            outline: none;
        }

        textarea {
            resize: none;
            height: 70px;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #2ebf91;
        }

        input[type="file"] {
            font-size: 13px;
        }

        input[type="submit"] {
            background: #2ebf91;
            color: #fff;
            padding: 10px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        input[type="submit"]:hover {
            background: #26a97f;
        }

        option {
            padding: 8px;
        }

        @media (max-width: 480px) {
            form {
                width: 90%;
            }
        }
    </style>
</head>

<body>
    <form action="" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <table border="2">

            <tr>
                <td>Name</td>
                <td>
                    <input type="text" name="txt_name" id="txt_name" required
                    placeholder="Enter Your Name"
                    title="Name Allows Only Alphabets,Spaces and First Letter Must Be Capital Letter"
                    pattern="^[A-Z]+[a-zA-Z ]*$" minlength="3">
                </td>
            </tr>

            <tr>
                <td>Email</td>
                <td>
                    <input type="email" required name="txt_email" id="txt_email">
                </td>
            </tr>

            <tr>
                <td>Contact</td>
                <td>
                    <input type="text" name="txt_contact" id="txt_contact"
                    pattern="[6-9]{1}[0-9]{9}"
                    title="Phone number with 6-9 and remaing 9 digit with 0-9"
                    minlength="7" maxlength="10">
                </td>
            </tr>

            <tr>
                <td>Address</td>
                <td>
                    <textarea required name="txt_address" id="txt_address"></textarea>
                </td>
            </tr>

            <tr>
                <td>District</td>
                <td>
                    <select required name="sel_district" id="sel_district">
                        <option value="">--select--</option>
                        {% for i in districtdata %}
                        <option value="{{i.id}}">
                            {{i.district_name}}
                        </option>
                        {% endfor %}
                    </select>
                </td>
            </tr>

            <tr>
                <td>Place</td>
                <td>
                    <select required name="sel_place" id="sel_place">
                        <option value="">--select--</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Photo</td>
                <td>
                    <input type="file" name="file_photo" id="file_photo" required accept="images/*">
                </td>
            </tr>

            <tr>
                <td>Password</td>
                <td>
                    <input type="password" name="txt_password" id="txt_password"
                    pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                    title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters">
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="submit">
                </td>
            </tr>

        </table>
    </form>
</body>
</html>

{% if msg %}
<script>
    alert("{{msg}}")
    window.location = "{% url 'Guest:UserRegistration' %}"
</script>
{% endif %}

<!-- jQuery & AJAX -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    $("#sel_district").change(function () {
        var districtId = $(this).val();
        var ur = "{% url 'Guest:Ajaxplace' %}";
        $.ajax({
            url: ur,
            data: { districtId: districtId },
            success: function (data) {
                $("#sel_place").html(data);
            },
        });
    });
</script>
{% endblock %}
