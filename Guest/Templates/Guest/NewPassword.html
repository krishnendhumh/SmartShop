{% extends 'Guest/Head.html' %}
{% load static %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
    :root {
        --reset-primary: #3b82f6;
        --reset-success: #22c55e;
        --reset-warning: #f59e0b;
        --reset-danger: #ef4444;
        --reset-bg: #0f172a;
    }

    .reset-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #1e293b, #0f172a);
        font-family: 'Plus Jakarta Sans', sans-serif;
        padding: 20px;
    }

    .reset-card {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 32px;
        padding: 3rem;
        width: 100%;
        max-width: 460px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        animation: cardFadeUp 0.7s ease-out;
    }

    @keyframes cardFadeUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .reset-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .reset-icon {
        width: 64px; height: 64px;
        background: rgba(34, 197, 94, 0.1);
        color: var(--reset-success);
        border: 1px solid rgba(34, 197, 94, 0.2);
        border-radius: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 1.8rem;
        margin-bottom: 1rem;
    }

    .reset-header h2 { color: white; font-weight: 700; margin-bottom: 8px; }
    .reset-header p { color: #94a3b8; font-size: 0.9rem; }

    /* Form Fields */
    .form-group { margin-bottom: 1.2rem; position: relative; }
    .reset-label {
        display: block;
        color: #cbd5e1;
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
    }

    .input-box { position: relative; }
    .input-box i:not(.toggle-icon) {
        position: absolute;
        left: 16px; top: 50%;
        transform: translateY(-50%);
        color: #64748b;
    }

    .reset-input {
        width: 100%;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        padding: 12px 45px 12px 48px;
        color: white;
        transition: 0.3s;
        outline: none;
    }

    .reset-input:focus {
        border-color: var(--reset-primary);
        background: rgba(15, 23, 42, 0.8);
    }

    .toggle-icon {
        position: absolute;
        right: 16px; top: 50%;
        transform: translateY(-50%);
        color: #64748b;
        cursor: pointer;
        font-size: 0.85rem;
    }

    /* Strength Meter */
    .meter-container { height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; margin: 12px 0; overflow: hidden; }
    .meter-fill { height: 100%; width: 0%; transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 10px; }
    .status-text { font-size: 0.75rem; font-weight: 500; min-height: 18px; margin-bottom: 10px; }

    /* Button */
    .update-btn {
        width: 100%;
        padding: 16px;
        background: var(--reset-primary);
        color: white;
        border: none;
        border-radius: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 1rem;
    }

    .update-btn:hover {
        background: #2563eb;
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
    }

    .back-login {
        display: block;
        text-align: center;
        margin-top: 2rem;
        color: #94a3b8;
        text-decoration: none;
        font-size: 0.9rem;
    }

    .back-login:hover { color: white; }
</style>

<div class="reset-wrapper">
    <div class="reset-card">
        <div class="reset-header">
            <div class="reset-icon">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2>Set New Password</h2>
            <p>Verification successful! Secure your account now.</p>
        </div>

        {% if msg %}
        <div style="background: rgba(239, 68, 68, 0.1); color: #fca5a5; padding: 12px; border-radius: 12px; font-size: 0.85rem; margin-bottom: 1.5rem; text-align: center; border: 1px solid rgba(239, 68, 68, 0.2);">
            <i class="fa-solid fa-circle-exclamation me-2"></i> {{ msg }}
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="reset-label">New Password</label>
                <div class="input-box">
                    <i class="fa-solid fa-key"></i>
                    <input type="password" name="txt_newpassword" id="newpass" class="reset-input" placeholder="••••••••" required onkeyup="evalStrength(this.value)">
                    <i class="fa-solid fa-eye-slash toggle-icon" onclick="togglePass('newpass', this)"></i>
                </div>
                <div class="meter-container"><div class="meter-fill" id="meter-fill"></div></div>
                <div id="status-text" class="status-text"></div>
            </div>

            <div class="form-group" style="margin-top: 1.5rem;">
                <label class="reset-label">Confirm Password</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="txt_confirmpassword" id="confpass" class="reset-input" placeholder="••••••••" required onkeyup="checkMatch()">
                    <i class="fa-solid fa-eye-slash toggle-icon" onclick="togglePass('confpass', this)"></i>
                </div>
                <div id="match-text" class="status-text" style="margin-top: 8px;"></div>
            </div>

            <button type="submit" class="update-btn">
                Update Password <i class="fa-solid fa-circle-check"></i>
            </button>

            <a href="{% url 'Guest:Login' %}" class="back-login">
                <i class="fa-solid fa-arrow-left me-2"></i> Return to login
            </a>
        </form>
    </div>
</div>

<script>
function togglePass(inputId, icon) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
    } else {
        input.type = 'password';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
    }
}

function evalStrength(val) {
    const fill = document.getElementById('meter-fill');
    const txt = document.getElementById('status-text');
    if (!val) { fill.style.width = '0'; txt.innerText = ''; return; }

    let strength = 0;
    if (val.length >= 8) strength += 25;
    if (val.match(/[a-z]/) && val.match(/[A-Z]/)) strength += 25;
    if (val.match(/\d/)) strength += 25;
    if (val.match(/[^a-zA-Z\d]/)) strength += 25;

    fill.style.width = strength + '%';
    
    if (strength <= 25) {
        fill.style.background = 'var(--reset-danger)';
        txt.innerHTML = `<span style="color:var(--reset-danger)">Weak (Too simple)</span>`;
    } else if (strength <= 50) {
        fill.style.background = 'var(--reset-warning)';
        txt.innerHTML = `<span style="color:var(--reset-warning)">Medium (Add symbols/caps)</span>`;
    } else {
        fill.style.background = 'var(--reset-success)';
        txt.innerHTML = `<span style="color:var(--reset-success)">Strong Password ✓</span>`;
    }
}

function checkMatch() {
    const p = document.getElementById('newpass').value;
    const c = document.getElementById('confpass').value;
    const txt = document.getElementById('match-text');
    if (!c) { txt.innerText = ''; return; }
    
    if (p === c) {
        txt.innerHTML = `<span style="color:var(--reset-success)">Passwords match</span>`;
    } else {
        txt.innerHTML = `<span style="color:var(--reset-danger)">Passwords do not match</span>`;
    }
}
</script>
{% endblock %}
