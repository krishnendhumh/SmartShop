<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Registration</title>
</head>
<body>
    <form action="" method="post" enctype="multipart/form-data">
         {% csrf_token %}
        <table border="2"><tr>
            <td>Name</td>
            <td><input type="text" name="txt_name" id="txt_name"required placeholder="Enter Your Name" title="Name Allows Only Alphabets,Spaces and First Letter Must Be Capital Letter" pattern="^[A-Z]+[a-zA-Z ]*$" minlength="3"></td>
        </tr>
        <tr>
            <td>Email</td>
            <td><input type="text" name="txt_email" id="txt_email" required minlength="5"></td>
        </tr>
        <tr>
            <td>Contact</td>
            <td><input type="text" name="txt_contact" id="txt_contact" pattern="[6-9]{1}[0-9]{9}" 
                title="Phone number with 6-9 and remaing 9 digit with 0-9" minlength="7" maxlength="10"></td>
        </tr>
        <tr>
            <td>Address</td>
            <td><textarea name="txt_address" id="txt_address" required minlength="3"></textarea></td>
        </tr>
        <tr>
            <td>Photo</td>
            <td><input type="file" name="file_photo" id="file_photo" required accept="images/*"></td>
        </tr>
        <tr>
            <td>Proof</td>
            <td><input type="file" name="file_proof" id="file_proof" required accept="images/*"></td>
        </tr>
        <tr>
            <td>District</td>
             <td><select required ="sel_district" id="sel_district">
                    <option value="">--select--</option>
                    {% for i in districtdata %}
                    <option value="{{i.id}}">
                        {{i.district_name}}</option>
                    {% endfor %}
                </select>

            </td>
        </tr>
        <tr>
            <td>Place</td>
            <td><select name="sel_place" id="sel_place" required>
                        <option value="">--select--</option>
                        
                    </select></td>
        </tr>
        <tr>
            <td>Password</td>
            <td><input type="password" name="txt_password" id="txt_password"pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters"></td>
        </tr>
        <tr>
            <td colspan="2" align="center"><input type="submit" value="Submit"></td>
            
        </tr></table>
    </form>
</body>
</html>
{% if msg %}
<script>
    alert("{{msg}}")
    window.location = "{% url 'Guest:ShopReg' %}"
</script>
{% endif %}

<!-- jQuery & AJAX -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    $("#sel_district").change(function () {
        var districtId = $(this).val();
        var ur = "{% url 'Guest:Ajaxplace' %}";
        $.ajax({
            url: ur,
            data: { districtId: districtId },
            success: function (data) {
                $("#sel_place").html(data);
            },
        });
    });
</script>
