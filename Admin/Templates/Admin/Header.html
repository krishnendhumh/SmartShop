{% load static %}
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShopiX</title>
    <link rel="shortcut icon" type="image/png" href="{% static 'Main/assets/img/Logo1.png' %}" />
    <link rel="stylesheet" href="{% static 'Admin/assets/css/styles.min.css' %}" />
</head>

<body>
    <!--  Body Wrapper -->
    <div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"

        <!-- Sidebar Start -->
<aside class="left-sidebar">
  <div>

    <div class="brand-logo d-flex align-items-center justify-content-between">
      <a href="{% url 'Admin:Homepage' %}" class="text-nowrap logo-img">
        <img src="{% static 'Main/assets/img/Logo1.png' %}" width="180" alt="">
      </a>

      <div class="close-btn d-xl-none d-block sidebartoggler cursor-pointer" id="sidebarCollapse">
        <i class="ti ti-x fs-8"></i>

    </div>

    <nav class="sidebar-nav scroll-sidebar" data-simplebar="">
      <ul id="sidebarnav">

        <li class="nav-small-cap">

        <li class="sidebar-item">

            <i class="ti ti-tag"></i>
            <span class="hide-menu">Brand</span>
          </a>
        </li>

        <!-- Shop -->
        <li class="nav-small-cap">
          <span class="hide-menu">SHOP</span>
        </li>

        <li class="sidebar-item">
          <a class="sidebar-link" href="{% url 'Admin:ShopVerification' %}">
            <i class="ti ti-check"></i>
            <span class="hide-menu">Shop Verification</span>
          </a>
        </li>

        <!-- Users -->
        <li class="nav-small-cap">
          <span class="hide-menu">USERS</span>
        </li>

        <li class="sidebar-item">
          <a class="sidebar-link" href="{% url 'Admin:UserList' %}">
            <i class="ti ti-users"></i>
            <span class="hide-menu">User List</span>
          </a>
        </li>

        <li class="sidebar-item">
          <a class="sidebar-link" href="{% url 'Admin:Viewcomplaint' %}">
            <i class="ti ti-message"></i>
            <span class="hide-menu">Complaints</span>
          </a>
        </li>

        <li class="sidebar-item">
          <a class="sidebar-link" href="{% url 'Admin:Viewfeedback' %}">
            <i class="ti ti-star"></i>
            <span class="hide-menu">Feedback</span>
          </a>
        </li>

        <li class="nav-small-cap">
          <span class="hide-menu">REPORTS</span>
        </li>

        <li class="sidebar-item">
          <a class="sidebar-link" href="{% url 'Admin:SalesReport' %}">
            <i class="ti ti-chart-bar"></i>
            <span class="hide-menu">Sales Report</span>
          </a>
        </li>

        <li class="nav-small-cap">
          <span class="hide-menu">AUTH</span>
        </li>

        <li class="sidebar-item">
          <a class="sidebar-link" href="{% url 'Admin:logout' %}">
            <i class="ti ti-logout"></i>
            <span class="hide-menu">Logout</span>

        </li>

                                        height="35" class="rounded-circle">
                                </a>

                                    <div class="message-body">

                                            class="d-flex align-items-center gap-2 dropdown-item">
                                            <i class="ti ti-user fs-6"></i>
                                            <p class="mb-0 fs-3">My Profile</p>
                                        </a>
                                        <a href="javascript:void(0)"
                                            class="d-flex align-items-center gap-2 dropdown-item">
                                            <i class="ti ti-mail fs-6"></i>
                                            <p class="mb-0 fs-3">My Account</p>
                                        </a>
                                        <a href="javascript:void(0)"
                                            class="d-flex align-items-center gap-2 dropdown-item">
                                            <i class="ti ti-list-check fs-6"></i>
                                            <p class="mb-0 fs-3">My Task</p>
                                        </a> -->
                                        <a href="{% url 'Admin:logout' %}"
                                            class="btn btn-outline-primary mx-3 mt-2 d-block">Logout</a>
                                    </div>
                                </div>
                            </li>
                        </ul>
                    </div>
                </nav>
            </header>
            <!--  Header End -->

            <div class="container-fluid">

                {% endblock %}

            </div>

            
        </div>
    </div>
    </div>
    <script src="{% static 'Admin/assets/libs/jquery/dist/jquery.min.js' %}"></script>
    <script src="{% static 'Admin/assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'Admin/assets/js/sidebarmenu.js' %}"></script>
    <script src="{% static 'Admin/assets/js/app.min.js' %}"></script>
    <script src="{% static 'Admin/assets/libs/apexcharts/dist/apexcharts.min.js' %}"></script>
    <script src="{% static 'Admin/assets/libs/simplebar/dist/simplebar.js' %}"></script>
