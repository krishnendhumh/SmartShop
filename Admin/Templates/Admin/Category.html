{% extends 'Admin/Header.html' %}

{% block content %}
<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width, initial-scale=1.0">
    <title>Category</title>
    <style>
    /* ---------- Global Look ---------- */
    body {
        font-family: 'Poppins', 'Segoe UI', Roboto, Arial, sans-serif;
        background: linear-gradient(120deg, #f4f7fb, #eaf0ff);
        padding: 30px;
        color: #1f2937;
    }

    /* ---------- Card Style Tables ---------- */
    table {
        width: 100%;
        max-width: 650px;
        margin: auto;
        border-collapse: collapse;
        background: #ffffff;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
    }

    table:first-of-type {
        margin-bottom: 45px;
    }

    td {
        padding: 15px 18px;
        font-size: 16px;
        font-weight: 500;
        border: none;
    }

    tr:nth-child(even) {
        background-color: #f9fbff;
    }

    /* ---------- Form Labels ---------- */
    table:first-of-type td:first-child {
        font-weight: 600;
        color: #374151;
        font-size: 16px;
    }

    /* ---------- Input Field ---------- */
    input[type="text"] {
        width: 100%;
        padding: 12px 15px;
        border-radius: 10px;
        border: 1.5px solid #d1d5db;
        font-size: 16px;
        font-weight: 500;
        transition: all 0.3s ease;
        outline: none;
    }

    input[type="text"]:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.2);
        background: #f8faff;
    }

    /* ---------- Buttons ---------- */
    input[type="submit"] {
        padding: 11px 26px;
        margin: 6px;
        border-radius: 10px;
        border: none;
        background: linear-gradient(135deg, #6366f1, #4338ca);
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        letter-spacing: 0.4px;
        transition: all 0.3s ease;
    }

    input[type="submit"]:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(67, 56, 202, 0.35);
    }

    /* ---------- Data Table ---------- */
    table:last-of-type {
        max-width: 850px;
    }

    table:last-of-type tr:first-child {
        background: #eef2ff;
        font-weight: 600;
        color: #1e3a8a;
    }

    table:last-of-type tr:hover {
        background: #f1f5ff;
        transition: background 0.2s ease;
    }

    /* ---------- Action Buttons ---------- */
    a {
        text-decoration: none;
        padding: 7px 14px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        margin-right: 8px;
        transition: all 0.3s ease;
        display: inline-block;
    }

    a[href*="del"] {
        background: #fee2e2;
        color: #b91c1c;
    }

    a[href*="edit"] {
        background: #e0e7ff;
        color: #3730a3;
    }

    a:hover {
        transform: scale(1.07);
        opacity: 0.9;
    }

    /* ---------- SlNo Highlight ---------- */
    td:first-child {
        font-weight: 600;
        color: #2563eb;
    }

    /* ---------- Mobile Responsive ---------- */
    @media (max-width: 768px) {
        table {
            width: 100%;
        }

        tr {
            display: block;
            margin-bottom: 16px;
        }

        td {
            display: block;
            width: 100%;
        }
    }
</style>
</head>

<body>
    <form action="" method="post">
        {% csrf_token %}
        <table border="2">
            <tr>
                <td>Category</td>
                <td><input type="text" name="txt_category" id="txt_category" value="{{editdata.category_name}}"  required placeholder="Enter category Name" title="Name Allows Only Alphabets,Spaces and First Letter Must Be Capital Letter" pattern="^[A-Z]+[a-zA-Z ]*$" minlength="3"></td>
          
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="submit">
                    <input type="submit" value="clear">
                </td>

            </tr>
        </table>
    </form>
    <br>
    <table border="2">
        <tr>
            <td>SlNo</td>
            <td>Category Name</td>
            <td>Action</td>
        </tr>
        {% for i in categorydata %}
        <tr>
            <td>{{ forloop.counter}}</td>
            <td>{{ i.category_name}}</td>
            <td><a href="{% url 'Admin:delcategory' i.id %}">Delete</a>
            <a href="{% url 'Admin:editcategory' i.id %}">Edit</a></td>
        </tr>
        {% endfor %}
       
    </table>
</body>

</html>

{% if msg %}
<script>
    alert("{{msg}}")
    window.location="{% url 'Admin:Category' %}"
</script>
{% endif %}

{% endblock %}
