{% extends 'Admin/Header.html' %}

{% block content %}
<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width, initial-scale=1.0">
    <title>Brand</title>
    <style>
    body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(135deg, #f5f7fa, #e4ecf5);
        
        color: #333;
    }

    /* Main Form Table */
    table {
        width: 100%;
        max-width: 600px;
        margin: auto;
        border-collapse: collapse;
        background: #ffffff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    table:first-of-type {
        margin-bottom: 40px;
    }

    td {
        padding: 14px;
        border: none;
        font-size: 15px;
    }

    tr:nth-child(even) {
        background-color: #f9fbfd;
    }

    /* Input field */
    input[type="text"] {
        width: 100%;
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid #d0d7e2;
        outline: none;
        transition: all 0.3s ease;
    }

    input[type="text"]:focus {
        border-color: #6c9cff;
        box-shadow: 0 0 0 3px rgba(108, 156, 255, 0.2);
    }

    /* Buttons */
    input[type="submit"] {
        padding: 10px 20px;
        margin: 5px;
        border-radius: 8px;
        border: none;
        background: linear-gradient(135deg, #6c9cff, #4e73ff);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    input[type="submit"]:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(78, 115, 255, 0.35);
    }

    /* List Table */
    table:last-of-type {
        max-width: 800px;
    }

    table:last-of-type tr:first-child {
        background: #eef3ff;
        font-weight: 600;
    }

    table:last-of-type tr:hover {
        background-color: #f0f6ff;
        transition: background 0.2s ease;
    }

    /* Action links */
    a {
        text-decoration: none;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        margin-right: 6px;
        transition: all 0.3s ease;
    }

    a[href*="del"] {
        background: #ffe5e5;
        color: #d63031;
    }

    a[href*="edit"] {
        background: #e8f0ff;
        color: #2d6cdf;
    }

    a:hover {
        opacity: 0.85;
        transform: scale(1.05);
    }

    /* Mobile responsive */
    @media (max-width: 768px) {
        table {
            width: 100%;
        }

        td {
            display: block;
            width: 100%;
        }

        tr {
            display: block;
            margin-bottom: 15px;
        }
    }

    /* Global font upgrade */
    body {
        font-family: 'Poppins', 'Segoe UI', Roboto, Arial, sans-serif;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.3px;
        color: #1f2937;
    }

    /* Table text */
    td {
        font-size: 16px;
        font-weight: 500;
        color: #111827;
    }

    /* Headings row */
    table:last-of-type tr:first-child td {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.5px;
        color: #1e3a8a;
    }

    /* Form labels */
    table:first-of-type td:first-child {
        font-weight: 600;
        color: #374151;
        font-size: 16px;
    }

    /* Input text */
    input[type="text"] {
        font-size: 16px;
        font-weight: 500;
        color: #111827;
    }

    input[type="text"]::placeholder {
        color: #9ca3af;
        font-weight: 400;
    }

    /* Buttons text */
    input[type="submit"] {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.4px;
    }

    /* Action links */
    a {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.3px;
    }

    /* Table row numbers */
    td:first-child {
        font-weight: 600;
        color: #2563eb;
    }
</style>
</head>

<body>
    <form action="" method="post">
        {% csrf_token %}
        <table border="2">
            <tr>
                <td>Brand</td>
                <td><input type="text" name="txt_brand" id="txt_brand" value="{{editdata.brand_name}}" required></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="submit">
                    <input type="submit" value="clear">
                </td>

            </tr>
        </table>
    </form>
    <br>
    <table border="2">
        <tr>
            <td>SlNo</td>
            <td>Brand Name</td>
            <td>Action</td>
        </tr>
        {% for i in branddata %}
        <tr>
            <td>{{ forloop.counter}}</td>
            <td>{{ i.brand_name}}</td>
            <td><a href="{% url 'Admin:delbrand' i.id %}">Delete</a>
            <a href="{% url 'Admin:editbrand' i.id %}">Edit</a></td>
        </tr>
        {% endfor %}
       
    </table>
</body>

</html>

{% if msg %}
<script>
    alert("{{msg}}")
    window.location="{% url 'Admin:Brand' %}"
</script>
{% endif %}


{% endblock %}
