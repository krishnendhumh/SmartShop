{% extends 'Admin/Header.html' %}

{% block content %}
<style>
    /* Inheriting Poppins from your header link */
    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #f5f7fa, #e4ecf5);
        color: #1f2937;
        margin: 0;
        padding: 20px;
    }

    h2 {
        text-align: center;
        color: #1e3a8a;
        font-weight: 600;
        margin-bottom: 30px;
    }

    /* Main Form Table */
    .form-container table {
        width: 100%;
        max-width: 600px;
        margin: 0 auto 40px auto;
        border-collapse: collapse;
        background: #ffffff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    .form-container td {
        padding: 20px;
        border: none;
    }

    /* Input field */
    input[type="text"] {
        width: 100%;
        padding: 12px 15px;
        border-radius: 8px;
        border: 1px solid #d0d7e2;
        outline: none;
        font-size: 16px;
        transition: all 0.3s ease;
        box-sizing: border-box;
    }

    input[type="text"]:focus {
        border-color: #6c9cff;
        box-shadow: 0 0 0 3px rgba(108, 156, 255, 0.2);
    }

    /* Buttons */
    .btn-group {
        text-align: center;
        padding: 20px;
    }

    input[type="submit"], input[type="reset"] {
        padding: 10px 25px;
        margin: 5px;
        border-radius: 8px;
        border: none;
        background: linear-gradient(135deg, #6c9cff, #4e73ff);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    input[type="reset"] {
        background: #9ca3af;
    }

    input[type="submit"]:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(78, 115, 255, 0.35);
    }

    /* List Table */
    .list-container table {
        width: 100%;
        max-width: 800px;
        margin: auto;
        border-collapse: collapse;
        background: #ffffff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    .list-container tr:first-child {
        background: #eef3ff;
        color: #1e3a8a;
        font-weight: 700;
    }

    .list-container td {
        padding: 15px;
        border-bottom: 1px solid #f0f3f7;
    }

    /* Action links */
    .actions a {
        text-decoration: none;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        margin-right: 10px;
        display: inline-block;
        transition: all 0.3s ease;
    }

    .btn-delete { background: #ffe5e5; color: #d63031; }
    .btn-edit { background: #e8f0ff; color: #2d6cdf; }

    .actions a:hover {
        transform: scale(1.05);
        filter: brightness(0.95);
    }
</style>

<div class="form-container">
    <h2>Manage Brands</h2>
    <form action="" method="post">
        {% csrf_token %}
        <table>
            <tr>
                <td width="30%"><strong>Brand Name</strong></td>
                <td>
                    <input type="text" name="txt_brand" id="txt_brand" 
                           value="{{editdata.brand_name}}" 
                           placeholder="e.g. Samsung & Co"
                           required
                           pattern="^[A-Z][a-zA-Z0-9\s&()\-]*$"
                           title="Must start with a capital letter. Allows & and spaces.">
                </td>
            </tr>
            <tr>
                <td colspan="2" class="btn-group">
                    <input type="submit" value="Save Brand">
                    <input type="reset" value="Clear">
                </td>
            </tr>
        </table>
    </form>
</div>

<div class="list-container">
    <table>
        <tr>
            <td width="10%">SlNo</td>
            <td>Brand Name</td>
            <td width="25%" align="center">Action</td>
        </tr>
        {% for i in branddata %}
        <tr>
            <td style="color: #2563eb; font-weight: 600;">{{ forloop.counter }}</td>
            <td>{{ i.brand_name }}</td>
            <td class="actions" align="center">
                <a href="{% url 'Admin:editbrand' i.id %}" class="btn-edit">Edit</a>
                <a href="{% url 'Admin:delbrand' i.id %}" class="btn-delete" 
                   onclick="return confirm('Are you sure you want to delete this brand?')">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3" align="center">No brands registered yet.</td>
        </tr>
        {% endfor %}
    </table>
</div>

{% if msg %}
<script>
    alert("{{msg}}");
    window.location="{% url 'Admin:Brand' %}";
</script>
{% endif %}

{% endblock %}
