{% extends 'User/Head.html' %}
{% block content %}

<style>

/* Wrapper */
.up-wrapper{
max-width:520px;
margin:auto;
animation:upFade .6s ease;
}

/* Card */
.up-card{
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 10px 35px rgba(0,0,0,0.1);
}

/* Title */
.up-title{
text-align:center;
font-size:22px;
font-weight:700;
margin-bottom:25px;
}

/* Input group */
.up-group{
position:relative;
margin-bottom:20px;
}

/* Input field */
.up-input{
width:100%;
padding:12px 12px 12px 40px;
border-radius:8px;
border:1px solid #ddd;
font-size:14px;
transition:.3s;
}

.up-input:focus{
border-color:#ff7b7b;
box-shadow:0 0 6px rgba(255,123,123,.4);
outline:none;
}

/* Icons */
.up-icon{
position:absolute;
left:12px;
top:13px;
color:#888;
}

/* Button */
.up-btn-area{
text-align:center;
margin-top:20px;
}

.up-btn{
background:#ff7b7b;
color:white;
border:none;
padding:10px 20px;
border-radius:8px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

.up-btn:hover{
background:#ff5252;
transform:translateY(-2px);
}

/* Animation */
@keyframes upFade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>


<div class="up-wrapper">

<form action="" method="post">
{% csrf_token %}

<div class="up-card">

<div class="up-title">
<i class="fas fa-user-edit"></i> Edit Profile
</div>

<!-- Name -->
<div class="up-group">

<i class="fas fa-user up-icon"></i>

<input
type="text"
name="txt_name"
class="up-input"
value="{{user.user_name}}"
placeholder="Enter Your Name"
pattern="^[A-Z]+[a-zA-Z ]*$"
required>

</div>


<!-- Email -->
<div class="up-group">

<i class="fas fa-envelope up-icon"></i>

<input
type="email"
name="txt_email"
class="up-input"
value="{{user.user_email}}"
placeholder="Enter Email"
required>

</div>


<!-- Contact -->
<div class="up-group">

<i class="fas fa-phone up-icon"></i>

<input
type="text"
name="txt_contact"
class="up-input"
value="{{user.user_contact}}"
pattern="[6-9]{1}[0-9]{9}"
maxlength="10"
placeholder="Enter Contact Number"
required>

</div>


<!-- Address -->
<div class="up-group">

<i class="fas fa-map-marker-alt up-icon"></i>

<input
type="text"
name="txt_address"
class="up-input"
value="{{user.user_address}}"
placeholder="Enter Address"
required>

</div>


<div class="up-btn-area">

<button type="submit" class="up-btn">
<i class="fas fa-save"></i> Update Profile
</button>

</div>

</div>

</form>

</div>


{% if msg %}
<script>
alert("{{msg}}")
window.location="{% url 'User:MyProfile' %}"
</script>
{% endif %}

{% endblock %}
