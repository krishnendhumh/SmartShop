<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EditProfile
    </title>
</head>

<body>
    <form action="" method="post">
         {% csrf_token %}
    <table border="2"><tr>
       
        <td>Name</td>
        <td><input type="text" name="txt_name" id="txt_name"value="{{user.user_name}}" required placeholder="Enter Your Name" title="Name Allows Only Alphabets,Spaces and First Letter Must Be Capital Letter" pattern="^[A-Z]+[a-zA-Z ]*$" minlength="3"></td>
            </td>
    </tr>
    <tr>
        <td>Email</td>
        <td><input type="text" name="txt_email" id="txt_email" value="{{user.user_email}}" required></td>
    </tr>
    <tr>
        <td>Contact</td>
        <td><input type="text" name="txt_contact" id="txt_contact" value="{{user.user_contact}}"pattern="[6-9]{1}[0-9]{9}" 
                title="Phone number with 6-9 and remaing 9 digit with 0-9" minlength="7" maxlength="10"></td>
            </tr>></td>
    </tr>
    <tr>
        <td>Address</td>
        <td><input type="text"name="txt_address" id="txt_address" value="{{user.user_address}}"></textarea></td>
    </tr>
    <tr>
    
        <td colspan="2" align="center"><input type="submit" value="Update"></td>
    </tr></table>
    </form>
</body>
</html>
{% if msg %}
<script>
    alert("{{msg}}")
    window.location = "{% url 'User:MyProfile' %}"
</script>
{% endif %}
