{% extends 'User/Head.html' %}
{% block content %}

<style>

/* Wrapper */
.cp-wrapper{
max-width:500px;
margin:auto;
animation:cpFade .6s ease;
}

/* Card */
.cp-card{
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 10px 35px rgba(0,0,0,0.1);
}

/* Title */
.cp-title{
text-align:center;
font-size:22px;
font-weight:700;
margin-bottom:25px;
}

/* Input group */
.cp-group{
position:relative;
margin-bottom:20px;
}

/* Input */
.cp-input{
width:100%;
padding:12px 12px 12px 40px;
border-radius:8px;
border:1px solid #ddd;
font-size:14px;
transition:.3s;
}

/* Input focus */
.cp-input:focus{
border-color:#ff7b7b;
box-shadow:0 0 6px rgba(255,123,123,.4);
outline:none;
}

/* Icon */
.cp-icon{
position:absolute;
left:12px;
top:13px;
color:#888;
}

/* Buttons */
.cp-btn-area{
text-align:center;
margin-top:20px;
}

.cp-btn{
background:#ff7b7b;
color:white;
border:none;
padding:10px 20px;
border-radius:8px;
font-weight:600;
cursor:pointer;
margin:5px;
transition:.3s;
}

.cp-btn:hover{
background:#ff5252;
transform:translateY(-2px);
}

.cp-cancel{
background:#6c757d;
}

.cp-cancel:hover{
background:#555;
}

/* Animation */
@keyframes cpFade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>


<div class="cp-wrapper">

<form action="" method="post">
{% csrf_token %}

<div class="cp-card">

<div class="cp-title">
<i class="fas fa-key"></i> Change Password
</div>

<!-- Old Password -->
<div class="cp-group">

<i class="fas fa-lock cp-icon"></i>

<input
type="password"
name="txt_password"
class="cp-input"
placeholder="Old Password"
pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
required>

</div>

<!-- New Password -->
<div class="cp-group">

<i class="fas fa-key cp-icon"></i>

<input
type="password"
name="txt_newpassword"
class="cp-input"
placeholder="New Password"
pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
required>

</div>

<!-- Confirm Password -->
<div class="cp-group">

<i class="fas fa-check-circle cp-icon"></i>

<input
type="password"
name="txt_repassword"
class="cp-input"
placeholder="Confirm Password"
pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
required>

</div>

<div class="cp-btn-area">

<button type="submit" class="cp-btn">
<i class="fas fa-sync-alt"></i> Change Password
</button>

<button type="reset" class="cp-btn cp-cancel">
Cancel
</button>

</div>

</div>

</form>

</div>


{% if msg %}
<script>
alert("{{msg}}")
window.location="{% url 'User:MyProfile' %}"
</script>
{% endif %}

{% endblock %}
