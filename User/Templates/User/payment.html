{% extends 'User/Head.html' %}
{% block content %}

<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Checkout</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* PAGE BACKGROUND */

.shopix-checkout-wrapper{
display:flex;
justify-content:center;
padding:50px;
background:#f4f6fb;
min-height:90vh;
}

/* MAIN BOX */

.shopix-checkout-container{
display:flex;
gap:30px;
width:1100px;
}

/* LEFT PAYMENT SECTION */

.shopix-payment-section{
flex:2;
background:white;
padding:35px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

/* RIGHT ORDER SUMMARY */

.shopix-order-summary{
flex:1;
background:white;
padding:25px;
border-radius:12px;
height:fit-content;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

/* TITLES */

.shopix-title{
font-size:24px;
font-weight:600;
margin-bottom:20px;
}

.shopix-subtitle{
font-size:14px;
color:#666;
margin-bottom:25px;
}

/* FORM */

.shopix-form-group{
margin-bottom:18px;
}

.shopix-form-group label{
font-size:14px;
display:block;
margin-bottom:6px;
}

.shopix-input{
width:100%;
padding:12px;
border-radius:6px;
border:1px solid #ddd;
font-size:14px;
}

.shopix-input:focus{
outline:none;
border-color:#4361ee;
box-shadow:0 0 5px rgba(67,97,238,0.2);
}

/* ROW */

.shopix-row{
display:flex;
gap:12px;
}

/* PAYMENT OPTIONS */

.shopix-payment-options{
display:flex;
gap:10px;
margin-bottom:25px;
}

.shopix-option{
flex:1;
padding:12px;
border:1px solid #ddd;
border-radius:6px;
text-align:center;
cursor:pointer;
font-size:14px;
}

.shopix-option:hover{
border-color:#4361ee;
background:#f5f7ff;
}

/* PAY BUTTON */

.shopix-pay-btn{
width:100%;
padding:14px;
border:none;
background:linear-gradient(90deg,#4361ee,#3f37c9);
color:white;
font-size:16px;
border-radius:6px;
cursor:pointer;
margin-top:10px;
}

.shopix-pay-btn:hover{
opacity:.9;
}

/* ORDER SUMMARY */

.shopix-summary-row{
display:flex;
justify-content:space-between;
margin-bottom:10px;
font-size:14px;
}

.shopix-total{
font-size:18px;
font-weight:600;
color:#4361ee;
}

/* QR SECTION */

.shopix-qr{
text-align:center;
margin-top:20px;
border-top:1px dashed #ddd;
padding-top:15px;
}

.shopix-qr img{
width:140px;
}

/* PAYMENT ICONS */

.shopix-icons{
margin-top:20px;
text-align:center;
font-size:32px;
}

.shopix-icons i{
margin:0 8px;
}

.fa-cc-visa{color:#1a1f71}
.fa-cc-mastercard{color:#eb001b}
.fa-cc-paypal{color:#003087}

</style>

</head>

<body>

<div class="shopix-checkout-wrapper">

<form method="post">
{% csrf_token %}

<div class="shopix-checkout-container">

<!-- PAYMENT SECTION -->

<div class="shopix-payment-section">

<div class="shopix-title">
Secure Checkout
</div>

<div class="shopix-subtitle">
Your payment is encrypted and secure
</div>

<div class="shopix-payment-options">

<div class="shopix-option">
<i class="fa-solid fa-credit-card"></i> Card
</div>

<div class="shopix-option">
<i class="fa-solid fa-qrcode"></i> QR Pay
</div>

<div class="shopix-option">
<i class="fa-brands fa-google-pay"></i> UPI
</div>

</div>

<div class="shopix-form-group">
<label>Card Number</label>
<input type="text"
name="txtacno"
placeholder="1234 5678 9012 3456"
class="shopix-input"
maxlength="19"
pattern="[0-9 ]{19}"
inputmode="numeric"
required>
</div>

<div class="shopix-form-group">
<label>Card Holder</label>
<input type="text"
name="txtname"
placeholder="John Doe"
class="shopix-input"
required>
</div>

<div class="shopix-row">

<div class="shopix-form-group">
<label>Expiry</label>
<input type="text"
name="txtexpdate"
placeholder="MM/YY"
class="shopix-input"
maxlength="5"
required>
</div>

<div class="shopix-form-group">
<label>CVV</label>
<input type="password"
name="txtccv"
placeholder="123"
class="shopix-input"
maxlength="3"
pattern="[0-9]{3}"
inputmode="numeric"
required>
</div>

</div>

<button type="submit" name="btn_pay" class="shopix-pay-btn">
<i class="fa-solid fa-lock"></i> Pay Securely
</button>

<div class="shopix-icons">
<i class="fab fa-cc-visa"></i>
<i class="fab fa-cc-mastercard"></i>
<i class="fab fa-cc-paypal"></i>
</div>

</div>

<!-- ORDER SUMMARY -->

<div class="shopix-order-summary">

<h3>Order Summary</h3>

<hr style="margin:15px 0">

<div class="shopix-summary-row">
<span>Items</span>
<span>1</span>
</div>

<div class="shopix-summary-row">
<span>Shipping</span>
<span>Free</span>
</div>

<div class="shopix-summary-row">
<span>Tax</span>
<span>₹0</span>
</div>

<hr style="margin:15px 0">

<div class="shopix-summary-row shopix-total">
<span>Total</span>
<span>₹ {{bookingdata.booking_amount}}</span>
</div>

<div class="shopix-qr">

<p>Scan & Pay</p>

<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=PAYMENT{{bookingdata.id}}">

<p style="font-size:12px;color:#666">
UPI / Google Pay / PhonePe
</p>

</div>

</div>

</div>

</form>

</div>

<script>

/* CARD NUMBER FORMAT */

const cardInput = document.querySelector("input[name='txtacno']");

cardInput.addEventListener("input", function () {

let value = this.value.replace(/\D/g,'').substring(0,16);

let formatted = value.match(/.{1,4}/g);

this.value = formatted ? formatted.join(" ") : value;

});

/* CVV ONLY NUMBERS */

const cvv = document.querySelector("input[name='txtccv']");

cvv.addEventListener("input", function(){
this.value = this.value.replace(/\D/g,'');
});

/* EXPIRY FORMAT */

const expiry = document.querySelector("input[name='txtexpdate']");

expiry.addEventListener("input", function(){
    let value = this.value.replace(/\D/g,'').substring(0,4); // only digits, max 4

    if(value.length >=3){
        this.value = value.substring(0,2) + "/" + value.substring(2);
    } else {
        this.value = value;
    }
});

expiry.addEventListener("blur", function(){
    let parts = this.value.split("/");

    if(parts.length === 2){
        const month = parseInt(parts[0]);
        const year = parseInt(parts[1]);

        // Validate month
        if(month < 1 || month > 12){
            alert("Invalid expiry month");
            this.value = "";
            return false;
        }

        // Validate year and month against current date
        const today = new Date();
        const currentYear = today.getFullYear() % 100; // last two digits
        const currentMonth = today.getMonth() + 1;

        if(year < currentYear || (year === currentYear && month < currentMonth)){
            alert("Card has expired!");
            this.value = "";
            return false;
        }

        alert("Expiry date is valid!");
        return true;
    }
});



</script>

</body>
</html>

{% endblock %}
