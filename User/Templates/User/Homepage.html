<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #56ccf2, #2f80ed);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            width: 420px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 25px;
            color: #222;
        }

        .menu a {
            display: block;
            margin: 10px 0;
            padding: 12px;
            text-decoration: none;
            font-size: 15px;
            color: #ffffff;
            background: #2f80ed;
            border-radius: 8px;
            transition: 0.3s;
        }

        .menu a:hover {
            background: #256fd3;
            transform: translateY(-2px);
        }

        .menu a.cart {
            background: #27ae60;
        }

        .menu a.cart:hover {
            background: #219150;
        }

        @media (max-width: 480px) {
            .container {
                width: 90%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Welcome User</h2>

        <div class="menu">
            <a href="{% url 'User:MyProfile' %}">View Profile</a>
            <a href="{% url 'User:Viewproduct' %}">View Products</a>
            <a href="{% url 'User:Wishlists' %}">View Wishlist</a>
            <a href="{% url 'User:Complaint' %}">Add Complaint</a>
            <a href="{% url 'User:Feedback' %}">Give Feedback</a>
            <a href="{% url 'User:MyCart' %}" class="cart">My Cart Items</a>
            <a href="{% url 'User:MyBooking' %}">My Booking</a>
        </div>
    </div>
</body>
</html>
